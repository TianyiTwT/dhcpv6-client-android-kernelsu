<!DOCTYPE html>
<html lang="zh-CN" data-skin="miuix" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>DHCPv6 客户端 — 预览</title>

<script>
/* 与 index.html 完全同一段：首绘之前解析「跟随系统」 */
(function () {
	var dark = false;
	try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
	var pref = 'system';
	try { pref = localStorage.getItem('d6.theme') || 'system'; } catch (e) {}
	document.documentElement.dataset.theme =
		(pref === 'dark' || (pref === 'system' && dark)) ? 'dark' : 'light';
	try {
		var skin = localStorage.getItem('d6.skin');
		if (skin) document.documentElement.dataset.skin = skin;
	} catch (e) {}

	/* 预览专用：允许用 ?skin=material3&theme=dark&scene=noipv6 直接定格一个组合。
	   无头浏览器截图时没有点按钮的机会，靠这个参数把状态钉死。

	   注意这里**同时写进 localStorage**：app.js 的 initPrefs() 是从偏好存储
	   读皮肤的，只改 dataset 的话会被它按默认值（miuix / system）覆盖回去。
	   写进存储是最省事的对齐方式 —— 不用为预览在 app.js 里开一个后门。
	   代价是参数会留在 localStorage 里，所以每次截图都应把两个参数都给全。

	   index.html 里没有这一段：真机走 file://，location.search 恒为空。 */
	try {
		var q = new URLSearchParams(location.search);
		var qs = q.get('skin'), qt = q.get('theme');
		if (qs === 'miuix' || qs === 'material3') {
			document.documentElement.dataset.skin = qs;
			try { localStorage.setItem('d6.skin', qs); } catch (e2) {}
		}
		if (qt === 'light' || qt === 'dark') {
			document.documentElement.dataset.theme = qt;
			try { localStorage.setItem('d6.theme', qt); } catch (e2) {}
		}
	} catch (e) {}
})();
</script>

<link rel="stylesheet" href="style.css">
<style>
	/* 仅预览用。这个文件不会被打进模块包（见 build.sh 的排除规则），
	   里面的 body 结构与 index.html 保持一致。 */
	.pbar {
		display: flex; flex-wrap: wrap; gap: 6px;
		padding: 10px 16px;
		background: var(--surface-2);
		border-bottom: 1px solid var(--line);
	}
	.pbar button {
		height: 30px; padding: 0 11px;
		border: 1px solid var(--line-2); border-radius: 999px;
		background: var(--surface); color: var(--text-2);
		font-family: inherit; font-size: 12px; cursor: pointer;
	}
	.pbar button[aria-pressed="true"] {
		border-color: transparent;
		background: var(--accent); color: #fff;
	}
	.pbar-tag {
		align-self: center; margin-right: 2px;
		font-size: 12px; color: var(--text-3);
	}
</style>
</head>
<body>

<div class="pbar">
	<span class="pbar-tag">皮肤</span>
	<button type="button" data-proxy-skin="miuix">Miuix</button>
	<button type="button" data-proxy-skin="material3">Material 3</button>
	<span class="pbar-tag">主题</span>
	<button type="button" data-proxy-theme="system">跟随系统</button>
	<button type="button" data-proxy-theme="light">浅色</button>
	<button type="button" data-proxy-theme="dark">深色</button>
</div>
<div class="pbar">
	<span class="pbar-tag">场景</span>
	<button type="button" data-scene="ok" aria-pressed="true">已获取地址</button>
	<button type="button" data-scene="noipv6" aria-pressed="false">未取得地址</button>
	<button type="button" data-scene="stopped" aria-pressed="false">已暂停</button>
	<button type="button" data-scene="empty" aria-pressed="false">无网络</button>
	<button type="button" data-scene="off" aria-pressed="false">模块停用</button>
</div>

<header class="topbar">
	<button type="button" class="iconbtn" id="btnSettings" aria-label="设置">
		<svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
			<path d="M3 6h16M3 11h10M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
		</svg>
	</button>
	<h1 class="topbar-title">DHCPv6 客户端</h1>
</header>

<main class="main" id="main">
	<h2 class="page-title">DHCPv6 客户端</h2>

	<div class="banner" id="banner" hidden></div>

	<section class="status-card" id="statusCard">
		<div class="status-text">
			<p class="status-title" id="statusTitle">正在读取…</p>
			<p class="status-sub" id="statusSub"></p>
		</div>
		<span class="status-icon" id="statusIcon" aria-hidden="true"></span>
	</section>

	<section class="block">
		<h3 class="block-title">IPv6</h3>
		<div class="card" id="card6">
			<div class="placeholder">正在读取…</div>
		</div>
	</section>

	<section class="block">
		<h3 class="block-title">IPv4</h3>
		<div class="card" id="card4">
			<div class="placeholder">正在读取…</div>
		</div>
	</section>

	<p class="footnote" id="footnote"></p>
</main>

<footer class="actions">
	<button type="button" class="btn" id="btnRefresh">刷新</button>
	<button type="button" class="btn btn-primary" id="btnRestart">重启客户端</button>
</footer>

<button type="button" class="scrim" id="scrim" hidden aria-label="关闭设置"></button>

<section class="sheet" id="sheet" hidden aria-label="设置">
	<div class="sheet-handle"></div>
	<h2 class="sheet-title">设置</h2>

	<div class="sheet-group">
		<p class="field-label">外观</p>
		<div class="seg" role="group" aria-label="皮肤">
			<button type="button" class="seg-item" data-skin="miuix" aria-pressed="true">Miuix</button>
			<button type="button" class="seg-item" data-skin="material3" aria-pressed="false">Material 3</button>
		</div>
	</div>

	<div class="sheet-group">
		<p class="field-label">主题</p>
		<div class="seg" role="group" aria-label="主题">
			<button type="button" class="seg-item" data-theme-opt="system" aria-pressed="true">跟随系统</button>
			<button type="button" class="seg-item" data-theme-opt="light" aria-pressed="false">浅色</button>
			<button type="button" class="seg-item" data-theme-opt="dark" aria-pressed="false">深色</button>
		</div>
		<p class="field-hint">KernelSU 的 WebView 不一定上报系统深浅；这里可以手动指定。</p>
	</div>

	<div class="sheet-group">
		<p class="field-label">接口</p>
		<div class="sheet-list">
			<div class="list-row"><span>目标接口</span><span class="list-value" id="sIfname">—</span></div>
			<div class="list-row"><span>看门狗</span><span class="list-value" id="sWatchdog">—</span></div>
		</div>
	</div>

	<div class="sheet-group">
		<p class="field-label">关于</p>
		<div class="sheet-list">
			<div class="list-row"><span>DHCPv6 客户端</span><span class="list-value" id="sVersion">—</span></div>
		</div>
	</div>
</section>

<script>
/* ── 模拟内核桥 ────────────────────────────────────────────────
   真实环境里 window.ksu 由 KernelSU 的管理器注入。
   这里用真机抓下来的输出喂给同一份 app.js，保证渲染路径完全一致。 */

const PROPTEXT = [
	'id=dhcp6c-android',
	'name=DHCPv6 客户端',
	'version=v0.1.0',
	'versionCode=1',
	'author=TianyiTwT',
	'description=为 Android 补上 DHCPv6 有状态地址分配（IA_NA）。',
].join('\n');

const SCENES = {};

SCENES.ok = String.raw`RUNNING=1
PID=3964
WATCHDOG=1
IFNAME=wlan0
IFACE_UP=1
GLOBAL6=1
PAUSED=0
MODULE_OFF=0
IA_ADDR=2001:da8:208:38:34be:285a:4d57:4540
IA_ADDR_HEX=20010da80208003834be285a4d574540
DNS=
##ADDR
1: lo    inet 127.0.0.1/8 scope host lo\       valid_lft forever preferred_lft forever
1: lo    inet6 ::1/128 scope host \       valid_lft forever preferred_lft forever
17: wlan0    inet 10.39.153.4/15 brd 10.39.255.255 scope global wlan0\       valid_lft forever preferred_lft forever
17: wlan0    inet6 2001:da8:208:38:34be:285a:4d57:4540/128 scope global \       valid_lft forever preferred_lft forever
17: wlan0    inet6 fe80::8b8c:cd17:ed8d:f898/64 scope link stable-privacy \       valid_lft forever preferred_lft forever
21: rmnet_data1    inet6 240e:504:1931:b605:7089:41ff:fef3:fac4/64 scope global dynamic mngtmpaddr \       valid_lft forever preferred_lft forever`;

SCENES.noipv6 = String.raw`RUNNING=1
PID=3964
WATCHDOG=1
IFNAME=wlan0
IFACE_UP=1
GLOBAL6=0
PAUSED=0
MODULE_OFF=0
IA_ADDR=
IA_ADDR_HEX=
DNS=
##ADDR
1: lo    inet 127.0.0.1/8 scope host lo\       valid_lft forever preferred_lft forever
17: wlan0    inet 10.39.153.4/15 brd 10.39.255.255 scope global wlan0\       valid_lft forever preferred_lft forever
17: wlan0    inet6 fe80::8b8c:cd17:ed8d:f898/64 scope link stable-privacy \       valid_lft forever preferred_lft forever`;

SCENES.stopped = String.raw`RUNNING=0
PID=
WATCHDOG=1
IFNAME=wlan0
IFACE_UP=1
GLOBAL6=0
PAUSED=1
MODULE_OFF=0
IA_ADDR=
IA_ADDR_HEX=
DNS=
##ADDR
17: wlan0    inet 10.39.153.4/15 brd 10.39.255.255 scope global wlan0\       valid_lft forever preferred_lft forever
17: wlan0    inet6 fe80::8b8c:cd17:ed8d:f898/64 scope link stable-privacy \       valid_lft forever preferred_lft forever`;

SCENES.empty = String.raw`RUNNING=0
PID=
WATCHDOG=1
IFNAME=wlan0
IFACE_UP=0
GLOBAL6=0
PAUSED=0
MODULE_OFF=0
IA_ADDR=
IA_ADDR_HEX=
DNS=
##ADDR
1: lo    inet 127.0.0.1/8 scope host lo\       valid_lft forever preferred_lft forever`;

SCENES.off = String.raw`RUNNING=0
PID=
WATCHDOG=0
IFNAME=wlan0
IFACE_UP=0
GLOBAL6=0
PAUSED=0
MODULE_OFF=1
IA_ADDR=
IA_ADDR_HEX=
DNS=
##ADDR
1: lo    inet 127.0.0.1/8 scope host lo\       valid_lft forever preferred_lft forever`;

let scene = 'ok';
try {
	const qs = new URLSearchParams(location.search).get('scene');
	if (qs && SCENES[qs]) scene = qs;
} catch (e) {}
document.querySelectorAll('[data-scene]').forEach(b => {
	b.setAttribute('aria-pressed', String(b.dataset.scene === scene));
});

window.ksu = {
	exec(command, optionsJson, callbackName) {
		const out = (SCENES[scene] || '') + '\n##PROP\n' + PROPTEXT;
		setTimeout(() => {
			try { window[callbackName](0, out, ''); } catch (e) { /* noop */ }
		}, 120);
	},
	toast(message) {
		const el = document.createElement('div');
		el.textContent = message;
		el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);'
			+ 'padding:9px 15px;border-radius:999px;background:#1c1c1e;color:#fff;'
			+ 'font-size:13px;z-index:99';
		document.body.appendChild(el);
		setTimeout(() => el.remove(), 1400);
	},
};

document.querySelectorAll('[data-scene]').forEach(btn => {
	btn.addEventListener('click', () => {
		scene = btn.dataset.scene;
		document.querySelectorAll('[data-scene]').forEach(b => {
			b.setAttribute('aria-pressed', String(b === btn));
		});
		document.getElementById('btnRefresh').click();
	});
});

/* 皮肤/主题按钮不自己实现一遍，直接代理到设置面板里的真按钮 ——
   省得预览条和 app.js 各有一套逻辑、然后对不上。 */
document.querySelectorAll('[data-proxy-skin]').forEach(btn => {
	btn.addEventListener('click', () => {
		const t = document.querySelector('.sheet [data-skin="' + btn.dataset.proxySkin + '"]');
		if (t) t.click();
	});
});
document.querySelectorAll('[data-proxy-theme]').forEach(btn => {
	btn.addEventListener('click', () => {
		const t = document.querySelector('.sheet [data-theme-opt="' + btn.dataset.proxyTheme + '"]');
		if (t) t.click();
	});
});

/* 预览条上的高亮跟着真实偏好走（每次点击后同步一次） */
function syncBar() {
	const skin = document.documentElement.dataset.skin;
	const theme = document.documentElement.dataset.theme;
	document.querySelectorAll('[data-proxy-skin]').forEach(b => {
		b.setAttribute('aria-pressed', String(b.dataset.proxySkin === skin));
	});
	document.querySelectorAll('[data-proxy-theme]').forEach(b => {
		const want = b.dataset.proxyTheme;
		const on = want === 'system'
			? !localStorageThemeForced()
			: want === theme;
		b.setAttribute('aria-pressed', String(on));
	});
}
function localStorageThemeForced() {
	try { const t = localStorage.getItem('d6.theme') || 'system'; return t !== 'system'; } catch (e) { return false; }
}
document.addEventListener('click', () => setTimeout(syncBar, 0));
syncBar();
</script>

<script type="module" src="app.js"></script>
</body>
</html>
